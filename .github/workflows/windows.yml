# Instalador de Windows: compila buscador.exe en Windows y lo empaqueta con
# Inno Setup (windows/buscador.iss).
#
# - Al subir un tag «v*» (p. ej. `git tag v0.2.0 && git push origin v0.2.0`) crea
#   la versión en GitHub Releases con el instalador. La app instalada la usa
#   para «Buscar actualizaciones».
# - «Run workflow» (a mano) solo lo compila: el instalador queda como artefacto
#   de la ejecución, para probarlo sin publicar nada.
name: Instalador de Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="$GITHUB_REF_NAME"
          else
            V="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-prueba"
          fi
          echo "BUSCADOR_VERSION=$V" >> "$GITHUB_ENV"
          echo "BUSCADOR_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION_NUM=${V#v}" >> "$GITHUB_ENV"
          echo "Versión: $V"

      - name: Compilar
        run: cargo build --release --locked

      - name: Tests
        # Informativos: un fallo propio de Windows no impide crear el instalador.
        continue-on-error: true
        run: cargo test --release --locked

      - name: Crear el instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION_NUM" windows\buscador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem target\instalador

      - uses: actions/upload-artifact@v4
        with:
          name: buscador-windows-instalador
          path: target/instalador/*.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Instalador para Windows 10/11 (64 bits). Descarga \`buscador-${VERSION_NUM}-setup.exe\` y ábrelo.
          Si Windows muestra «Windows protegió su PC», pulsa «Más información» → «Ejecutar de todas formas» (el instalador no está firmado).
          También: \`[Net.ServicePointManager]::SecurityProtocol = 'Tls12'; irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex\` en PowerShell."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/instalador/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/instalador/*.exe --title "buscador $GITHUB_REF_NAME" --notes "$notes"
          fi
