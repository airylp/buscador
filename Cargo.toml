[package]
name = "buscador"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
chardetng = "1.0.0"
eframe = { version = "0.37", features = ["persistence", "glow"] }
# Fuentes de iconos/emojis incluidas (en egui 0.37 ya no van por defecto: sin ellas ⬇ ✔ ⚠ 🔒… salen como cuadros si el sistema no las tiene).
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
encoding_rs = "0.8.44"
# Imágenes de la vista de lectura de HTML (ya venía con PNG por otras dependencias).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
regex = "1.13.1"
rfd = "0.17.2"

# Proteger los archivos mapeados si otro programa los recorta (src/sigbus.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Ícono y datos de versión del .exe (solo al compilar en Windows): ver build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

# Menú nativo en la barra superior de macOS.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# Abrir archivos desde Finder («Abrir con»): ver src/macopen.rs.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "NSGeometry"] }
